<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>근태 관리 · tna</title><link rel="stylesheet" th:href="@{/app.css}"></head><body><header class="site-header admin-header"><a class="brand" th:href="@{/me/today}">tna</a><nav aria-label="주 메뉴"><a th:href="@{/me/attendance}">내 근태</a><a th:href="@{/admin/employees}">사원</a></nav><form th:action="@{/logout}" method="post"><button class="secondary">로그아웃</button></form></header><main class="content admin-shell"><p th:if="${error != null}" role="alert" class="notice error" th:text="${error}"></p>
<h1>휴일 캘린더</h1><p>담당자가 근거를 확인한 날짜만 명시합니다. 미등록 날짜는 미확인입니다. 요일만으로 법정 휴일을 추정하지 않습니다.</p><a th:href="@{/admin/networks}">허용 네트워크</a><section class="panel"><h2>불변 버전</h2><ul><li th:each="v:${calendars}" th:text="${'v'+v.revision+' · '+v.validFrom+' ~ '+v.validTo+' (종료 제외) · '+v.reason}"></li></ul></section>
<section class="panel"><h2>검토한 기간 등록</h2><p>아래 기간 전체를 일반일로 등록하고 예외 날짜를 지정합니다. 기존 기간과 중첩할 수 없습니다.</p><form th:action="@{/admin/calendar/versions}" method="post" class="admin-form"><input type="hidden" name="commandId" th:value="${form.commandId}"><label for="from">시작일 (포함)</label><input id="from" type="date" name="from" th:value="${form.from}" required><label for="to">종료일 (포함)</label><input id="to" type="date" name="to" th:value="${form.to}" required><label for="basis">기간 전체의 검토 근거</label><textarea id="basis" name="basis" th:text="${form.basis}" maxlength="500" required></textarea><label class="checkbox-label"><input type="checkbox" name="reviewed" value="true" th:checked="${form.reviewed}" required>기간의 일반일·비근로일·휴일 근거를 모두 검토했습니다</label><label for="exceptions">예외 날짜 (한 줄에 날짜|종류|이름|근거)</label><textarea id="exceptions" name="exceptions" rows="5" th:text="${form.exceptions}" placeholder="2026-12-25|HOLIDAY|공휴일|확인한 공식 근거"></textarea><p class="hint">종류: WORKDAY(일반일), NON_WORKDAY(명시 비근로일), HOLIDAY(근거 있는 휴일). 주간 템플릿의 비근로일은 별도로 유지됩니다.</p><label for="calendar-reason">등록 사유</label><textarea id="calendar-reason" name="reason" th:text="${form.reason}" maxlength="500" required></textarea><button type="submit">캘린더 버전 저장</button></form></section></main></body></html>

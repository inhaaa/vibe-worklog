<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><body><section class="panel" th:fragment="record"><h2>출근 기록·실제 근로 확인</h2><p th:text="${day.workDate+' · Asia/Seoul · 사실 v'+day.inputRevision+' / 검토 v'+day.reviewRevision}"></p><p th:if="${day.schedule==null}" class="notice">근무 일정 미배정 · 확인 필요</p><p th:if="${day.schedule!=null}" th:text="${day.schedule.workday?'예정 근무 '+day.schedule.startTime+'~'+day.schedule.endTime:'소정 비근로일'}"></p><p th:text="${'캘린더: '+day.dayKind}"></p><p>체류시간을 실제 근로로 자동 확정하지 않습니다. 중복·역전·자정 통과 기록은 정정 검토가 필요합니다.</p><div class="table-scroll"><table><thead><tr><th>원천 사건</th><th>서버 저장 시각 (서울)</th></tr></thead><tbody><tr th:each="e:${day.events}"><td th:text="${e.kind=='IN'?'출근':'퇴근'}"></td><td th:text="${eventTimes[e.id]}"></td></tr></tbody></table></div>
<p th:if="${day.confirmation!=null}" class="notice">현재 사실의 실제 근로·휴게 일치 확인이 저장되었습니다.</p><form th:action="@{/me/work-confirmations}" method="post" class="admin-form"><input type="hidden" name="workDate" th:value="${confirmationForm.workDate}"><input type="hidden" name="baseInputRevision" th:value="${confirmationForm.baseInputRevision}"><input type="hidden" name="expectedReviewRevision" th:value="${confirmationForm.expectedReviewRevision}"><input type="hidden" name="sourceFingerprint" th:value="${confirmationForm.sourceFingerprint}"><input type="hidden" name="commandId" th:value="${confirmationForm.commandId}"><h3>퇴근 후 본인 확인</h3><p>원천 한 쌍·같은 날짜·일정·캘린더가 유효해야 합니다. 실제가 다르면 확인하지 말고 정정 신청을 사용하세요.</p><ul th:if="${day.schedule!=null}"><li th:each="b:${day.schedule.breaks}" th:text="${'예정 휴게 '+b.startTime+' ~ '+b.endTime}"></li></ul><label class="checkbox-label"><input type="checkbox" name="presenceAsWork" value="true" th:checked="${confirmationForm.presenceAsWork}" required>출퇴근 사이에서 휴게를 제외한 실제 근로가 일치합니다</label><label class="checkbox-label"><input type="checkbox" name="breaksMatch" value="true" th:checked="${confirmationForm.breaksMatch}" required>실제 휴게가 표시된 예정 휴게와 일치합니다</label><button type="submit">현재 사실 확인 저장</button></form></section></body></html>

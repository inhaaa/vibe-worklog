<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>근태 관리 · tna</title><link rel="stylesheet" th:href="@{/app.css}"></head><body><header class="site-header admin-header"><a class="brand" th:href="@{/me/today}">tna</a><nav aria-label="주 메뉴"><a th:href="@{/me/attendance}">내 근태</a><a th:href="@{/admin/employees}">사원</a></nav><form th:action="@{/logout}" method="post"><button class="secondary">로그아웃</button></form></header><main class="content admin-shell"><p th:if="${error != null}" role="alert" class="notice error" th:text="${error}"></p>
<h1>허용 IP 네트워크</h1><p>시각 기준: Asia/Seoul (서울)</p><p>IP 일치는 현장 근로나 본인 존재를 보증하지 않습니다. 실제 접속 주소만 검증하며 전달 헤더로 우회할 수 없습니다.</p><a th:href="@{/admin/calendar}">휴일 캘린더</a>
<section class="panel"><h2>허용망 이력</h2><article th:each="n:${networks}"><h3 th:text="${n.label+' · '+n.network}"></h3><p th:text="${'시작 '+@seoulTime.instant(n.validFrom)+' · '+(n.validTo==null?'현재 유효':'종료 '+@seoulTime.instant(n.validTo))}"></p><form th:if="${n.validTo==null}" th:action="@{/admin/networks/{id}/close(id=${n.id})}" method="post" class="admin-form"><input type="hidden" name="commandId" th:value="${pageCommand}"><input type="hidden" name="expectedVersion" th:value="${n.version}"><label th:for="${'close-'+n.id}">종료 사유</label><input th:id="${'close-'+n.id}" name="reason" maxlength="500" required><button type="submit">허용 종료</button></form></article></section>
<section class="panel"><h2>허용망 추가</h2><form th:action="@{/admin/networks/changes}" method="post" class="admin-form"><input type="hidden" name="commandId" th:value="${form.commandId}"><label for="network">IPv4/IPv6 CIDR</label><input id="network" name="network" th:value="${form.network}" placeholder="192.0.2.0/24" required maxlength="80"><label for="label">명칭</label><input id="label" name="label" th:value="${form.label}" maxlength="120" required><input type="hidden" name="_wideConfirmed" value="on"><label class="checkbox-label"><input type="checkbox" name="wideConfirmed" value="true" th:checked="${form.wideConfirmed}">광범위 허용 위험을 검토했습니다</label><label for="network-reason">등록 사유</label><textarea id="network-reason" name="reason" th:text="${form.reason}" maxlength="500" required></textarea><button type="submit">허용망 저장</button></form></section></main></body></html>

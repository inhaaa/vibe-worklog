<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>운영자 로그인 · tna</title><link rel="stylesheet" th:href="@{/app.css}"></head><body><main class="login-shell"><section class="panel"><h1>운영자 로그인</h1><p>고객사 직원 계정과 별도인 운영자 전용 경로입니다.</p><p th:if="${param.error!=null}" role="alert">운영자 로그인 정보를 확인해 주세요.</p><form th:action="@{/operator/login}" method="post"><label for="loginId">운영자 로그인명</label><input id="loginId" name="loginId" autocomplete="username" maxlength="120" required><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required><button>운영자 로그인</button></form></section></main></body></html>

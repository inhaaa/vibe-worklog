<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>고객사 온보딩 · tna</title><link rel="stylesheet" th:href="@{/app.css}"></head><body><header class="site-header"><a class="brand" th:href="@{/operator/tenants}">tna 운영</a><form th:action="@{/operator/logout}" method="post"><button>운영자 로그아웃</button></form></header><main class="content admin-shell"><h1>고객사·최초 담당자 연결</h1><p>시각 기준: Asia/Seoul (서울)</p><p>회사 관계와 연락 경로 확인 후 신규 고객사만 등록합니다. 고객사 근태 열람·대리 승인 기능은 제공하지 않습니다.</p><p th:if="${param.saved!=null}" class="notice">처리했습니다. 신규 초대는 로컬 모의 전달이며 실제 메일을 발송하지 않습니다.</p><p th:if="${error!=null}" th:text="${error}" role="alert" class="notice error"></p><section class="panel"><h2>고객사 이용 상태</h2><article th:each="t:${tenants}"><h3 th:text="${t.companyCode+' · '+t.displayName}"></h3><p th:text="${t.active?'이용 활성':'이용 중지'}"></p><form th:action="@{/operator/tenants/{id}/state(id=${t.id})}" method="post" class="admin-form"><input type="hidden" name="active" th:value="${!t.active}"><input type="hidden" name="expectedVersion" th:value="${t.version}"><input type="hidden" name="commandId" th:value="${T(java.util.UUID).randomUUID()}"><label th:for="${'state-'+t.id}">이용 상태 변경 사유</label><input th:id="${'state-'+t.id}" name="reason" maxlength="500" required><button th:text="${t.active?'이용 중지':'이용 활성'}"></button></form><form th:if="${t.active}" th:action="@{/operator/tenants/{id}/initial-invitations(id=${t.id})}" method="post" class="admin-form"><input type="hidden" name="expectedVersion" th:value="${t.version}"><input type="hidden" name="commandId" th:value="${T(java.util.UUID).randomUUID()}"><p>최초 미수락 계정의 같은 이메일로만 재발급합니다. 수락한 계정이나 다른 관리자를 만들 수 없습니다.</p><label th:for="${'reissue-'+t.id}">최초 초대 재발급 사유</label><input th:id="${'reissue-'+t.id}" name="reason" maxlength="500" required><button>최초 미수락 초대 재발급</button></form></article></section><section class="panel"><h2>신규 연결</h2><form th:action="@{/operator/tenants}" method="post" class="admin-form"><input type="hidden" name="commandId" th:value="${form.commandId}"><label for="companyCode">회사 코드</label><input id="companyCode" name="companyCode" th:value="${form.companyCode}" maxlength="80" required><label for="companyName">회사명</label><input id="companyName" name="companyName" th:value="${form.companyName}" maxlength="120" required><label for="employeeNo">최초 담당자 사번</label><input id="employeeNo" name="employeeNo" th:value="${form.employeeNo}" maxlength="40" required><label for="employeeName">최초 담당자 이름</label><input id="employeeName" name="employeeName" th:value="${form.employeeName}" maxlength="120" required><label for="joinedOn">확인한 입사일</label><input id="joinedOn" type="date" name="joinedOn" th:value="${form.joinedOn}" required><label for="email">최초 담당자 업무 이메일</label><input id="email" name="email" type="email" th:value="${form.email}" maxlength="254" required><label for="relationshipBasis">회사 관계·연락 경로 검토 근거</label><textarea id="relationshipBasis" name="relationshipBasis" th:text="${form.relationshipBasis}" maxlength="500" required></textarea><label for="reason">등록 사유</label><textarea id="reason" name="reason" th:text="${form.reason}" maxlength="500" required></textarea><button>신규 회사·최초 초대 연결</button></form></section><section class="panel"><h2>운영 감사 (최근100개)</h2><ul><li th:each="a:${audit}" th:text="${@seoulTime.instant(a.createdAt)+' · '+a.action+' · '+a.reason+' · DB '+a.dbActor}"></li></ul></section></main></body></html>

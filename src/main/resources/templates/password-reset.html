<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>비밀번호 재설정 · tna</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<main class="login-shell">
    <section class="panel" aria-labelledby="reset-title">
        <p class="eyebrow">tna · 계정 보안</p><h1 id="reset-title">비밀번호 재설정</h1>
        <p th:if="${param.requested != null}" class="notice" role="status">일치하는 계정이 있으면 재설정 코드를 전달합니다. 현재는 로컬 모의 전달만 사용합니다.</p>
        <p th:if="${error != null}" class="notice error" role="alert" th:text="${error}">입력 내용을 확인해 주세요.</p>
        <h2>코드 요청</h2>
        <form th:action="@{/password-reset/request}" method="post">
            <label for="request-company">회사 코드</label><input id="request-company" name="companyCode" maxlength="80" required>
            <label for="request-email">이메일</label><input id="request-email" name="email" type="email" maxlength="254" autocomplete="username" required>
            <button type="submit">재설정 코드 요청</button>
        </form>
        <h2>새 비밀번호 설정</h2>
        <p>코드는30분 유효하며 한 번만 사용할 수 있습니다. 재발급하면 이전 코드는 사용할 수 없습니다.</p>
        <form th:action="@{/password-reset/complete}" method="post">
            <label for="complete-company">회사 코드</label><input id="complete-company" name="companyCode" maxlength="80" required>
            <label for="complete-email">이메일</label><input id="complete-email" name="email" type="email" maxlength="254" autocomplete="username" required>
            <label for="reset-token">재설정 코드</label><input id="reset-token" name="token" type="password" maxlength="43" autocomplete="off" required>
            <label for="reset-password">새 비밀번호</label><input id="reset-password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-help">
            <label for="reset-confirmation">비밀번호 확인</label><input id="reset-confirmation" name="confirmation" type="password" autocomplete="new-password" required>
            <p class="hint" id="password-help">공백을 포함한12~128자입니다. 오류 후 비밀번호와 코드는 다시 입력해 주세요.</p>
            <button type="submit">비밀번호 재설정</button>
        </form>
        <p><a th:href="@{/login}">로그인으로</a></p>
        <p class="hint">완료하면 기존 로그인이 종료됩니다. 실제 메일 발송은 제공하지 않는 로컬 검증 단계입니다.</p>
    </section>
</main>
</body></html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/workspace :: head('근무 배정')}"></head><body class="workspace-body" hx-history="false">
<div id="tna-app"><div class="t-app-shell"><aside th:replace="~{fragments/workspace :: sidebar('schedules')}"></aside><header th:replace="~{fragments/workspace :: topbar('근무 배정')}"></header>
<main class="t-main t-legacy-page content admin-shell"><p th:if="${error != null}" role="alert" class="notice error" th:text="${error}"></p>
<a th:href="@{/admin/employees/{id}(id=${employee.id})}">사원 상세</a><h1 th:text="${employee.displayName+' · 근무 배정'}"></h1>
<section class="panel"><h2>배정 이력</h2><p th:if="${#lists.isEmpty(assignments)}">배정이 없습니다. 일정 누락 날짜를 정상 근로일로 간주하지 않습니다.</p><div class="table-scroll"><table><thead><tr><th>템플릿</th><th>버전</th><th>시작 (포함)</th><th>종료 (제외)</th><th>사유</th></tr></thead><tbody><tr th:each="a:${assignments}"><td th:text="${a.templateName}"></td><td th:text="${a.revision}"></td><td th:text="${@seoulTime.date(a.validFrom)}"></td><td th:text="${a.validTo==null?'종료 없음':@seoulTime.date(a.validTo)}"></td><td th:text="${a.reason}"></td></tr></tbody></table></div></section>
<section class="panel"><h2>적용일 배정</h2><p>오늘 이후의 재직 기간 안에서 마지막 시작일보다 늦은 날을 선택하세요. 과거 정정·같은 날 교체·예약 취소는 이번 단위에서 제공하지 않습니다.</p>
<form th:action="@{/admin/employees/{id}/schedule(id=${employee.id})}" method="post" class="admin-form"><input type="hidden" name="commandId" th:value="${form.commandId}"><input type="hidden" name="expectedVersion" th:value="${form.expectedVersion}">
<label for="schedule-version">템플릿 버전</label><select id="schedule-version" name="scheduleVersionId" required><option value="">선택하세요</option><option th:each="v:${versions}" th:value="${v.id}" th:selected="${v.id==form.scheduleVersionId}" th:text="${templateNames[v.templateId]+' / v'+v.revision+' / '+@seoulTime.date(v.validFrom)}"></option></select>
<label for="assignment-from">적용 시작일</label><input id="assignment-from" name="validFrom" type="date" th:min="${today}" th:value="${form.validFrom}" required>
<label for="assignment-reason">배정 사유</label><textarea id="assignment-reason" name="reason" maxlength="500" rows="2" th:text="${form.reason}" required></textarea><button type="submit">근무 배정 저장</button></form></section></main></div></div></body></html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/workspace :: head('근무 템플릿')}"></head><body class="workspace-body" hx-history="false">
<div id="tna-app"><div class="t-app-shell"><aside th:replace="~{fragments/workspace :: sidebar('schedules')}"></aside><header th:replace="~{fragments/workspace :: topbar('근무 템플릿')}"></header>
<main class="t-main t-legacy-page content admin-shell"><p th:if="${error != null}" role="alert" class="notice error" th:text="${error}"></p>
<a th:href="@{/admin/schedules}">템플릿 목록</a><h1 th:text="${template.name}"></h1><p>근무 시간 기준: Asia/Seoul (서울)</p>
<section class="panel"><h2>불변 버전 이력</h2><article th:each="v:${versions}"><h3 th:text="${'버전 '+v.revision+' · 사용 시작 '+@seoulTime.date(v.validFrom)}"></h3><p th:text="${v.reason}"></p>
<div class="table-scroll"><table><thead><tr><th>요일</th><th>구분</th><th>시작</th><th>종료</th><th>예정 휴게</th></tr></thead><tbody><tr th:each="day:${versionDays[v.id]}"><td th:text="${day.weekday}"></td><td th:text="${day.workday?'근로일':'비근로일'}"></td><td th:text="${day.workday?@seoulTime.time(day.startTime):'해당 없음'}"></td><td th:text="${day.workday?@seoulTime.time(day.endTime):'해당 없음'}"></td><td><span th:each="pause:${day.breaks}" th:text="${@seoulTime.time(pause.startTime)+'–'+@seoulTime.time(pause.endTime)+' '}"></span></td></tr></tbody></table></div></article></section>
<section class="panel"><h2>새 버전 추가</h2><p>기존 버전과 배정은 유지합니다. 사원별 새 적용일 배정이 필요합니다.</p><form th:action="@{/admin/schedules/{id}/versions(id=${template.id})}" method="post" class="admin-form"><div th:replace="~{schedule/form :: fields}"></div></form></section></main></div></div></body></html>

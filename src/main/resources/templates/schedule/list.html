<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/workspace :: head('근무 설정')}"></head><body class="workspace-body" hx-history="false">
<div id="tna-app"><div class="t-app-shell"><aside th:replace="~{fragments/workspace :: sidebar('schedules')}"></aside><header th:replace="~{fragments/workspace :: topbar('근무 설정')}"></header>
<main class="t-main t-legacy-page content admin-shell"><p th:if="${error != null}" role="alert" class="notice error" th:text="${error}"></p>
<h1>고정 근무 템플릿</h1><p>여러 템플릿을 만들고 사원별 적용일로 배정합니다. 과거 배정은 당시 불변 버전을 사용합니다.</p>
<section class="panel"><h2>등록된 템플릿</h2><p th:if="${#lists.isEmpty(templates)}">등록된 템플릿이 없습니다.</p><ul><li th:each="item:${templates}"><a th:href="@{/admin/schedules/{id}(id=${item.id})}" th:text="${item.code+' · '+item.name}"></a></li></ul></section>
<section class="panel"><h2>새 템플릿</h2><form th:action="@{/admin/schedules}" method="post" class="admin-form"><div th:replace="~{schedule/form :: fields}"></div></form></section></main></div></div></body></html>

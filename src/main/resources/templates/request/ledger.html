<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>신청·승인 · tna</title><link rel="stylesheet" th:href="@{/app.css}"></head><body><header class="site-header admin-header"><a class="brand" th:href="@{/me/today}">tna</a><nav aria-label="주 메뉴"><a th:href="@{/me/requests}">내 신청</a><a th:href="@{/approvals}">승인함</a></nav><form th:action="@{/logout}" method="post"><button class="secondary">로그아웃</button></form></header><main class="content admin-shell"><p th:if="${error!=null}" role="alert" class="notice error" th:text="${error}"></p>
<h1>연차 원장</h1><section class="panel"><p>추가한 이력은 덮어쓰지 않습니다. 사용·복원은 원효력을 참조합니다.</p><div class="table-scroll"><table><thead><tr><th>종류</th><th>DAY 증감</th><th>기준일</th><th>근거·사유</th></tr></thead><tbody><tr th:each="e:${ledger}"><td th:text="${e.entryKind}"></td><td th:text="${e.signedQuantityDays}"></td><td th:text="${@seoulTime.date(e.effectiveOn)}"></td><td th:text="${e.sourceReference+' · '+e.reason}"></td></tr></tbody></table></div></section><section class="panel"><h2>증감 조정</h2><form th:action="@{/admin/leave-balances/buckets/{id}/adjustments(id=${bucketId})}" method="post" class="admin-form"><input type="hidden" name="expectedVersion" th:value="${adjustment.expectedVersion}"><input type="hidden" name="commandId" th:value="${adjustment.commandId}"><label for="delta">조정 DAY (감액은 음수)</label><input id="delta" name="quantityDays" type="number" step="1" required><label for="effective">효력 기준일</label><input id="effective" name="effectiveOn" type="date" th:value="${adjustment.effectiveOn}" required><label for="adjust-source">근거 참조</label><input id="adjust-source" name="sourceReference" maxlength="500" required><label for="adjust-reason">조정 사유</label><textarea id="adjust-reason" name="reason" maxlength="500" required></textarea><button>조정 원장 추가</button></form></section></main></body></html>

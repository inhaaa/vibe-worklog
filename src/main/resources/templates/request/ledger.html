<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/workspace :: head('연차 원장')}"></head><body class="workspace-body" hx-history="false"><div id="tna-app"><div class="t-app-shell"><aside th:replace="~{fragments/workspace :: sidebar('balances')}"></aside><header th:replace="~{fragments/workspace :: topbar('연차 원장')}"></header><main class="t-main t-legacy-page content admin-shell"><p th:if="${error!=null}" role="alert" class="notice error" th:text="${error}"></p>
<h1>연차 원장</h1><section class="panel"><p>추가한 이력은 덮어쓰지 않습니다. 사용·복원은 원효력을 참조합니다.</p><div class="table-scroll"><table><thead><tr><th>종류</th><th>DAY 증감</th><th>기준일</th><th>근거·사유</th></tr></thead><tbody><tr th:each="e:${ledger}"><td th:text="${e.entryKind}"></td><td th:text="${e.signedQuantityDays}"></td><td th:text="${@seoulTime.date(e.effectiveOn)}"></td><td th:text="${e.sourceReference+' · '+e.reason}"></td></tr></tbody></table></div></section><section class="panel"><h2>증감 조정</h2><form th:action="@{/admin/leave-balances/buckets/{id}/adjustments(id=${bucketId})}" method="post" class="admin-form"><input type="hidden" name="expectedVersion" th:value="${adjustment.expectedVersion}"><input type="hidden" name="commandId" th:value="${adjustment.commandId}"><label for="delta">조정 일수 (0.5일 단위, 감액은 음수)</label><input id="delta" name="quantityDays" type="number" min="-100000" max="100000" step="0.5" th:value="${adjustment.quantityDays}" required><label for="effective">효력 기준일</label><input id="effective" name="effectiveOn" type="date" th:value="${adjustment.effectiveOn}" required><label for="adjust-source">근거 참조</label><input id="adjust-source" name="sourceReference" maxlength="500" th:value="${adjustment.sourceReference}" required><label for="adjust-reason">조정 사유</label><textarea id="adjust-reason" name="reason" maxlength="500" th:text="${adjustment.reason}" required></textarea><button>조정 원장 추가</button></form></section></main></div></div></body></html>

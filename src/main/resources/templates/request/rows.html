<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><body><div th:fragment="rows" class="table-scroll"><table><thead><tr><th>대상</th><th>종류</th><th>기간</th><th>상태·효력</th><th>승인자</th></tr></thead><tbody><tr th:each="r:${requests}"><td th:text="${r.targetEmployeeName}"></td><td><a th:href="@{/requests/{id}(id=${r.id})}" th:text="${r.kind}"></a></td><td th:text="${@seoulTime.date(r.fromDate)+' ~ '+@seoulTime.date(r.toDate)}"></td><td th:text="${r.status+' / '+r.effectStatus}"></td><td th:text="${r.approverName}"></td></tr></tbody></table><p th:if="${#lists.isEmpty(requests)}">신청이 없습니다.</p></div></body></html>

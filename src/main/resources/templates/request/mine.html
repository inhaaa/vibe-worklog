<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/workspace :: head('휴가·신청')}"></head><body class="workspace-body" hx-history="false"><div id="tna-app"><div class="t-app-shell"><aside th:replace="~{fragments/workspace :: sidebar('requests')}"></aside><header th:replace="~{fragments/workspace :: topbar('휴가·신청')}"></header><main class="t-main t-legacy-page content admin-shell"><p th:if="${error!=null}" role="alert" class="notice error" th:text="${error}"></p>
<h1>내 근태 신청</h1><p><a th:href="@{/me/requests/correction}">출퇴근·실제 휴게 정정 신청</a></p><section class="panel"><h2>연차 잔여와 대기량</h2><p>정수 DAY 기초 잔여이며 자동 발생이 아닙니다. 대기는 예약·차감하지 않습니다.</p><ul><li th:each="b:${buckets}" th:text="${@seoulTime.date(b.usableFrom)+' ~ '+(b.usableTo==null?'종료 없음':@seoulTime.date(b.usableTo))+' · 현재 잔여 '+b.balanceDays+' / 사용 가능 '+b.availableDays+' / 대기 '+b.pendingDays+' DAY'}"></li></ul></section>
<section class="panel"><h2>종일 연차 신청</h2><form th:action="@{/me/requests/leave}" method="post" class="admin-form"><input type="hidden" name="commandId" th:value="${form.commandId}"><label for="bucket">기초 묶음</label><select id="bucket" name="bucketId" required><option value="">선택하세요</option><option th:each="b:${buckets}" th:value="${b.id}" th:selected="${b.id==form.bucketId}" th:text="${@seoulTime.date(b.usableFrom)+' ~ '+(b.usableTo==null?'종료 없음':@seoulTime.date(b.usableTo))+' / 사용 가능 '+b.availableDays+' DAY'}"></option></select><label for="from">시작일</label><input id="from" type="date" name="from" th:value="${form.from}" required><label for="to">종료일 (포함)</label><input id="to" type="date" name="to" th:value="${form.to}" required><label for="reason">사유</label><textarea id="reason" name="reason" rows="2" maxlength="500" th:text="${form.reason}" required></textarea><p class="hint">민감정보를 적지 마세요. 일정·휴일·유효기간은 승인 때 다시 검증합니다.</p><button>연차 신청 제출</button></form></section><section class="panel"><h2>신청 이력</h2><div th:replace="~{request/rows :: rows}"></div></section></main></div></div></body></html>

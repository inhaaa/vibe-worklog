<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/workspace :: head('기록 정정 신청')}"></head><body class="workspace-body" hx-history="false"><div id="tna-app"><div class="t-app-shell"><aside th:replace="~{fragments/workspace :: sidebar('requests')}"></aside><header th:replace="~{fragments/workspace :: topbar('기록 정정 신청')}"></header><main class="t-main t-legacy-page content admin-shell"><p th:if="${error!=null}" role="alert" class="notice error" th:text="${error}"></p>
<h1>출퇴근·실제 휴게 정정 신청</h1><p>시각 기준: Asia/Seoul (서울)</p><p th:if="${exceptional}" class="notice">담당자 예외 신청입니다. 작성자·대상자와 다른 적격 승인자의 독립 승인이 필요합니다.</p><section class="panel"><h2 th:text="${@seoulTime.date(day.workDate)+' · 현재 원천'}"></h2><ul><li th:each="e:${day.events}" th:text="${e.kind+' · '+eventTimes[e.id]}"></li></ul><p>원천은 수정·삭제하지 않으며 승인된 정정 효과를 추가합니다.</p><form th:action="${exceptional}?@{/admin/requests/exceptions}:@{/me/requests/correction}" method="post" class="admin-form"><input type="hidden" name="targetEmployeeId" th:value="${form.targetEmployeeId}"><input type="hidden" name="workDate" th:value="${form.workDate}"><input type="hidden" name="baseInputRevision" th:value="${form.baseInputRevision}"><input type="hidden" name="sourceFingerprint" th:value="${form.sourceFingerprint}"><input type="hidden" name="commandId" th:value="${form.commandId}"><input type="hidden" name="exceptional" th:value="${exceptional}"><label for="in-action">출근 변경</label><select id="in-action" name="inAction"><option th:each="a:${actions}" th:value="${a}" th:selected="${a==form.inAction}" th:text="${a}"></option></select><label for="in-at">SET 출근 시각 (서울)</label><input id="in-at" name="requestedInAt" type="datetime-local" step="0.001" th:value="${form.requestedInAt}"><label for="out-action">퇴근 변경</label><select id="out-action" name="outAction"><option th:each="a:${actions}" th:value="${a}" th:selected="${a==form.outAction}" th:text="${a}"></option></select><label for="out-at">SET 퇴근 시각 (서울)</label><input id="out-at" name="requestedOutAt" type="datetime-local" step="0.001" th:value="${form.requestedOutAt}"><p class="hint">KEEP은 현재 값을 유지하고 SET은 제안 시각, CLEAR는 누락 상태로 정정합니다. SET이 아니면 시각을 비우세요.</p><input type="hidden" name="_presenceAsWork" value="on"><label class="checkbox-label"><input type="checkbox" name="presenceAsWork" value="true" th:checked="${form.presenceAsWork}">제안 구간의 실제 근로를 확인했습니다</label><input type="hidden" name="_breaksConfirmed" value="on"><label class="checkbox-label"><input type="checkbox" name="breaksConfirmed" value="true" th:checked="${form.breaksConfirmed}">실제 휴게를 확인했습니다 (없으면 아래 비움)</label><label for="breaks">실제 휴게 구간 (시작/종료, 쉼표 구분)</label><textarea id="breaks" name="actualBreaks" rows="3" th:text="${form.actualBreaks}" placeholder="2026-10-23T12:00/2026-10-23T13:00"></textarea><label for="replaces">변경할 현재 승인 정정 ID (있으면)</label><input id="replaces" name="replacesRequestId" th:value="${form.replacesRequestId}"><label for="correction-reason">정정 사유와 사실 근거</label><textarea id="correction-reason" name="reason" maxlength="500" th:text="${form.reason}" required></textarea><p class="hint">민감정보를 적지 마세요. 확인되지 않은 실제 근로는 정상0시간으로 간주하지 않습니다.</p><button>정정 심사 요청</button></form></section></main></div></div></body></html>

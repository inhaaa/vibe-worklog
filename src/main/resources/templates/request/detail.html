<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>신청·승인 · tna</title><link rel="stylesheet" th:href="@{/app.css}"></head><body><header class="site-header admin-header"><a class="brand" th:href="@{/me/today}">tna</a><nav aria-label="주 메뉴"><a th:href="@{/me/requests}">내 신청</a><a th:href="@{/approvals}">승인함</a></nav><form th:action="@{/logout}" method="post"><button class="secondary">로그아웃</button></form></header><main class="content admin-shell"><p th:if="${error!=null}" role="alert" class="notice error" th:text="${error}"></p>
<h1>신청 상세</h1><p>시각 기준: Asia/Seoul (서울)</p><section class="panel"><h2 th:text="${request.targetEmployeeName+' · '+request.kind}"></h2><p th:text="${@seoulTime.date(request.fromDate)+' ~ '+@seoulTime.date(request.toDate)+' / '+request.quantityDays+' DAY'}"></p><p th:text="${request.status+' · 현재 효력 '+request.effectStatus+' / v'+request.version}"></p><p th:text="${request.reason}"></p><p th:text="${'지정 승인자 '+request.approverName}"></p><p th:if="${request.kind=='CANCEL_LEAVE'}">취소 심사 중에는 원승인·차감이 유지됩니다.</p><p th:if="${request.originalRequestId!=null}"><a th:href="@{/requests/{id}(id=${request.originalRequestId})}">원신청</a></p><ul><li th:each="d:${detail.days}" th:text="${@seoulTime.date(d.leaveDate)+' · '+d.quantityDays+' DAY · '+d.zeroReason}"></li></ul><div th:if="${detail.correction!=null}"><h3>요청한 정정</h3><p th:text="${'출근 '+detail.correction.inAction+(detail.correction.inAction=='SET'?' '+@seoulTime.instant(detail.correction.requestedInAt):'')+' / 퇴근 '+detail.correction.outAction+(detail.correction.outAction=='SET'?' '+@seoulTime.instant(detail.correction.requestedOutAt):'')}"></p><p th:text="${'실제 휴게 '+(detail.correction.breaksConfirmed?@seoulTime.intervals(detail.correction.actualBreaks):'미확인')}"></p><p>원천 기록은 보존하며 승인된 최신 정정 효과만 적용합니다.</p></div></section>
<section class="panel"><h2>결정·변경</h2><form th:if="${canDecide}" th:action="@{/requests/{id}/approve(id=${request.id})}" method="post" class="admin-form"><input type="hidden" name="expectedVersion" th:value="${request.version}"><input type="hidden" name="commandId" th:value="${pageCommand}"><label for="approve-reason">승인 검토 사유</label><textarea id="approve-reason" name="reason" maxlength="500" required></textarea><button>독립 승인</button></form><form th:if="${canDecide}" th:action="@{/requests/{id}/reject(id=${request.id})}" method="post" class="admin-form"><input type="hidden" name="expectedVersion" th:value="${request.version}"><input type="hidden" name="commandId" th:value="${pageCommand}"><label for="reject-reason">반려 사유</label><textarea id="reject-reason" name="reason" maxlength="500" required></textarea><button class="secondary">반려</button></form>
<form th:if="${canWithdraw}" th:action="@{/requests/{id}/withdraw(id=${request.id})}" method="post" class="admin-form"><input type="hidden" name="expectedVersion" th:value="${request.version}"><input type="hidden" name="commandId" th:value="${pageCommand}"><label for="withdraw-reason">철회 사유</label><input id="withdraw-reason" name="reason" maxlength="500" required><button class="secondary">대기 신청 철회</button></form>
<form th:if="${canCancel}" th:action="@{/requests/{id}/cancellations(id=${request.id})}" method="post" class="admin-form"><input type="hidden" name="expectedVersion" th:value="${request.version}"><input type="hidden" name="commandId" th:value="${pageCommand}"><label for="cancel-reason">취소 요청 사유</label><textarea id="cancel-reason" name="reason" maxlength="500" required></textarea><p>예정 시작 전 본인 요청만 일반 취소를 지원합니다. 지난 날짜는 담당자 예외 경로가 필요합니다.</p><button class="secondary">취소 심사 요청</button></form>
<form th:if="${admin and request.status=='PENDING'}" th:action="@{/admin/requests/{id}/reassign(id=${request.id})}" method="post" class="admin-form"><h3>대기 건 명시 재할당</h3><input type="hidden" name="expectedVersion" th:value="${request.version}"><input type="hidden" name="commandId" th:value="${pageCommand}"><label for="new-approver">새 승인자</label><select id="new-approver" name="approverEmployeeId" required><option th:each="c:${candidates}" th:value="${c.id}" th:text="${c.displayName}"></option></select><label for="reassign-reason">재할당 사유</label><input id="reassign-reason" name="reason" maxlength="500" required><button>재할당 저장</button></form>
<form th:if="${canCancelException}" th:action="@{/admin/requests/{id}/cancellation-exceptions(id=${request.id})}" method="post" class="admin-form"><h3>과거·퇴사자 예외 취소</h3><input type="hidden" name="expectedVersion" th:value="${request.version}"><input type="hidden" name="commandId" th:value="${pageCommand}"><label for="exception-reason">검토 근거와 예외 취소 사유</label><textarea id="exception-reason" name="reason" maxlength="500" required></textarea><p>다른 적격 승인자의 독립 승인이 필요합니다.</p><button>예외 취소 심사 요청</button></form></section>
<section class="panel"><h2>처리 이력</h2><ol><li th:each="h:${detail.history}" th:text="${@seoulTime.instant(h.createdAt)+' · '+h.eventKind+' · '+h.fromStatus+' → '+h.toStatus+' · '+h.reason}"></li></ol></section></main></body></html>

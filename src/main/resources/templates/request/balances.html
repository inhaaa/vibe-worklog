<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>신청·승인 · tna</title><link rel="stylesheet" th:href="@{/app.css}"></head><body><header class="site-header admin-header"><a class="brand" th:href="@{/me/today}">tna</a><nav aria-label="주 메뉴"><a th:href="@{/me/requests}">내 신청</a><a th:href="@{/approvals}">승인함</a></nav><form th:action="@{/logout}" method="post"><button class="secondary">로그아웃</button></form></header><main class="content admin-shell"><p th:if="${error!=null}" role="alert" class="notice error" th:text="${error}"></p>
<h1>기초 잔여 관리</h1><form th:action="@{/admin/leave-balances}" method="get"><label for="employee">사원</label><select id="employee" name="employeeId"><option th:each="e:${employees}" th:value="${e.id}" th:selected="${e.id==employee.id}" th:text="${e.employeeNo+' · '+e.displayName}"></option></select><button>조회</button></form><p><a th:href="@{/admin/requests}">고객사 신청·예외 현황</a> · <a th:href="@{/admin/requests/exceptions/new(employeeId=${employee.id})}">예외 정정 신청</a></p><section class="panel"><h2 th:text="${employee.displayName+' · 기초 묶음'}"></h2><ul><li th:each="b:${buckets}"><a th:href="@{/admin/leave-balances/buckets/{id}(id=${b.id})}" th:text="${@seoulTime.date(b.usableFrom)+' ~ '+(b.usableTo==null?'종료 없음':@seoulTime.date(b.usableTo))+' / 잔여 '+b.balanceDays+' DAY / 대기 '+b.pendingDays+' DAY'}"></a></li></ul></section>
<section class="panel"><h2>근거 있는 기초 등록</h2><p>자동 발생이 아닙니다. 본인의 기초 등록·증감은 다른 담당자가 처리합니다. 소수 단위는 지원하지 않습니다.</p><form th:action="@{/admin/leave-balances/entries}" method="post" class="admin-form"><input type="hidden" name="employeeId" th:value="${form.employeeId}"><input type="hidden" name="commandId" th:value="${form.commandId}"><label for="base">기초 기준일</label><input id="base" name="baseDate" type="date" th:value="${form.baseDate}" required><label for="usable-from">사용 가능 시작일</label><input id="usable-from" name="usableFrom" type="date" th:value="${form.usableFrom}" required><label for="usable-to">사용 가능 종료일 (포함)</label><input id="usable-to" name="usableTo" type="date" th:value="${form.usableTo}"><label for="quantity">기초 일수 (정수 DAY)</label><input id="quantity" name="quantityDays" type="number" min="0" step="1" th:value="${form.quantityDays}" required><label for="source">발생 근거 참조</label><input id="source" name="sourceReference" maxlength="500" th:value="${form.sourceReference}" required><label for="opening-reason">등록 사유</label><textarea id="opening-reason" name="reason" maxlength="500" th:text="${form.reason}" required></textarea><button>기초 원장 등록</button></form></section></main></body></html>

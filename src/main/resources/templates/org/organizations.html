<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/workspace :: head('조직 관리')}"></head>
<body class="workspace-body" hx-history="false">
<div id="tna-app"><div class="t-app-shell"><aside th:replace="~{fragments/workspace :: sidebar('organizations')}"></aside><header th:replace="~{fragments/workspace :: topbar('조직 관리')}"></header>
<main class="t-main t-legacy-page content admin-shell">
    <p class="eyebrow">조직·사원 관리</p>
    <h1>조직 관리</h1>
    <section class="panel" aria-labelledby="organization-list-title">
        <h2 id="organization-list-title">조직 목록</h2>
        <form th:action="@{/admin/organizations}" method="get" class="search-form" role="search">
            <div>
                <label for="organization-query">조직 검색</label>
                <input id="organization-query" name="q" type="search" th:value="${q}" placeholder="코드 또는 이름">
            </div>
            <button type="submit">검색</button>
            <a th:href="@{/admin/organizations}">전체 보기</a>
        </form>
        <p th:if="${#lists.isEmpty(organizations)}" class="notice"
           th:text="${#strings.isEmpty(q)} ? '등록된 조직이 없습니다. 아래에서 첫 조직을 등록해 주세요.' : '검색 결과가 없습니다. 검색어를 확인해 주세요.'">등록된 조직이 없습니다.</p>
        <div class="table-scroll" th:unless="${#lists.isEmpty(organizations)}" role="region" aria-label="조직 목록" tabindex="0">
            <table>
                <caption class="sr-only">조직 코드, 이름, 상위 조직과 활성 상태</caption>
                <thead><tr><th scope="col">코드</th><th scope="col">이름</th><th scope="col">상위 조직</th><th scope="col">상태</th></tr></thead>
                <tbody>
                <tr th:each="organization : ${organizations}">
                    <td th:text="${organization.code}">ORG</td>
                    <td><a th:href="@{/admin/organizations/{id}(id=${organization.id})}" th:text="${organization.name}">조직 이름</a></td>
                    <td th:text="${organization.parentId == null ? '없음' : orgNames[organization.parentId]}">없음</td>
                    <td th:text="${organization.active} ? '활성' : '비활성'">활성</td>
                </tr>
                </tbody>
            </table>
        </div>
        <nav class="actions pagination" aria-label="조직 목록 페이지">
            <a th:if="${page > 0}" th:href="@{/admin/organizations(q=${q},page=${page - 1})}">이전 페이지</a>
            <span th:text="|${page + 1}페이지|">1페이지</span>
            <a th:if="${hasNext}" th:href="@{/admin/organizations(q=${q},page=${page + 1})}">다음 페이지</a>
        </nav>
    </section>
    <section class="panel" aria-labelledby="organization-create-title">
        <h2 id="organization-create-title">조직 등록</h2>
        <p th:if="${error != null}" class="notice error" role="alert" th:text="${error}">입력 내용을 확인해 주세요.</p>
        <form th:action="@{/admin/organizations}" method="post" class="admin-form">
            <input type="hidden" name="commandId" th:value="${form.commandId}">
            <label for="organization-code">조직 코드</label>
            <input id="organization-code" name="code" type="text" th:value="${form.code}" maxlength="40" required>
            <p class="hint">등록 후 코드는 변경할 수 없습니다.</p>
            <label for="organization-name">조직 이름</label>
            <input id="organization-name" name="name" type="text" th:value="${form.name}" maxlength="120" required>
            <label for="organization-parent">상위 조직</label>
            <select id="organization-parent" name="parentId">
                <option value="">없음 (최상위 조직)</option>
                <option th:each="option : ${options}" th:if="${option.active}" th:value="${option.id}"
                        th:selected="${option.id == form.parentId}" th:text="${option.name}">상위 조직</option>
            </select>
            <input type="hidden" name="_active" value="on">
            <label class="checkbox-label" for="organization-active"><input id="organization-active" name="active" type="checkbox" value="true" th:checked="${form.active}">활성 조직</label>
            <label for="organization-reason">등록 사유</label>
            <textarea id="organization-reason" name="reason" rows="3" maxlength="500" required aria-describedby="organization-reason-help" th:text="${form.reason}"></textarea>
            <p id="organization-reason-help" class="hint">500자 이내로 입력하세요. 불필요한 개인정보는 적지 마세요.</p>
            <div class="actions"><button type="submit">조직 등록</button></div>
        </form>
    </section>
</main>
</div></div></body>
</html>

<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>근로시간 검토 · tna</title><link rel="stylesheet" th:href="@{/app.css}"></head><body><header class="site-header admin-header"><a class="brand" th:href="@{/me/today}">tna</a><nav aria-label="주 메뉴"><a th:href="@{/me/requests}">내 신청</a><a th:href="@{/me/worktime}">내 근로시간</a></nav><form th:action="@{/logout}" method="post"><button class="secondary">로그아웃</button></form></header><main class="content admin-shell"><p th:if="${error!=null}" role="alert" class="notice error" th:text="${error}"></p>
<h1>고객사 감사 이력</h1><p>열람 자체를 감사합니다. 최소 주체·대상·행위·사유만 표시하며 비밀번호·토큰·IP를 제공하지 않습니다.</p><section class="panel"><div class="table-scroll"><table><thead><tr><th>시각</th><th>행위</th><th>대상</th><th>처리 주체</th><th>사유</th></tr></thead><tbody><tr th:each="r:${audits}"><td th:text="${r.at}"></td><td th:text="${r.action}"></td><td th:text="${r.targetKind+' · '+r.targetId}"></td><td th:text="${r.actorAccountId}"></td><td th:text="${r.reason}"></td></tr></tbody></table></div></section></main></body></html>

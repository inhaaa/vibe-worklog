<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>근로시간 검토 · tna</title><link rel="stylesheet" th:href="@{/app.css}"></head><body><header class="site-header admin-header"><a class="brand" th:href="@{/me/today}">tna</a><nav aria-label="주 메뉴"><a th:href="@{/me/requests}">내 신청</a><a th:href="@{/me/worktime}">내 근로시간</a></nav><form th:action="@{/logout}" method="post"><button class="secondary">로그아웃</button></form></header><main class="content admin-shell"><p th:if="${error!=null}" role="alert" class="notice error" th:text="${error}"></p>
<h1>적용 대상·주 기산점 검토</h1><p>법률 적합성을 자동 인증하지 않습니다. 근거를 확인한 적용 대상과 기간만 명시하며 민감한 보호 사유는 수집하지 않습니다. 변경은 새 불변 버전입니다.</p><form th:action="@{/admin/work-policies}" method="get"><label for="employee">대상 사원</label><select id="employee" name="employeeId"><option th:each="e:${employees}" th:value="${e.id}" th:selected="${e.id==employeeId}" th:text="${e.employeeNo+' · '+e.displayName}"></option></select><button>조회</button></form>
<section class="panel"><h2>사업장 주 기산점</h2><ul><li th:each="p:${policies}" th:text="${'v'+p.revision+' · '+p.validFrom+' ~ '+p.validTo+' · 월요일 일치검토 '+p.mondayWeekReviewed+' · '+p.basis}"></li></ul><form th:action="@{/admin/work-policies}" method="post" class="admin-form"><input type="hidden" name="commandId" th:value="${policyForm.commandId}"><label for="policy-from">적용 시작일</label><input id="policy-from" name="from" type="date" th:value="${policyForm.from}" required><label for="policy-to">종료일 (포함)</label><input id="policy-to" name="to" type="date" th:value="${policyForm.to}" required><input type="hidden" name="_mondayWeekReviewed" value="on"><label class="checkbox-label"><input type="checkbox" name="mondayWeekReviewed" value="true" th:checked="${policyForm.mondayWeekReviewed}">실제 회사의 주 기산점이 월요일인 것을 확인했습니다</label><label for="policy-basis">검토 근거</label><textarea id="policy-basis" name="basis" maxlength="500" th:text="${policyForm.basis}" required></textarea><label for="policy-reason">등록 사유</label><input id="policy-reason" name="reason" maxlength="500" th:value="${policyForm.reason}" required><button>기산점 검토 버전 저장</button></form></section>
<section class="panel"><h2>사원별 일반 규정 적용 검토</h2><ul><li th:each="r:${assessments}" th:text="${'v'+r.revision+' · '+r.validFrom+' ~ '+r.validTo+' · 일반규정 검토 '+r.generalRuleReviewed+' · '+r.basis}"></li></ul><form th:action="@{/admin/work-assessments}" method="post" class="admin-form"><input type="hidden" name="employeeId" th:value="${assessmentForm.employeeId}"><input type="hidden" name="commandId" th:value="${assessmentForm.commandId}"><label for="assessment-from">적용 시작일</label><input id="assessment-from" name="from" type="date" th:value="${assessmentForm.from}" required><label for="assessment-to">종료일 (포함)</label><input id="assessment-to" name="to" type="date" th:value="${assessmentForm.to}" required><input type="hidden" name="_generalRuleReviewed" value="on"><label class="checkbox-label"><input type="checkbox" name="generalRuleReviewed" value="true" th:checked="${assessmentForm.generalRuleReviewed}">성인 통상 고정 근무의 일반 규정 적용을 검토했습니다</label><p>단시간·보호 대상·특례·적용 제외 등 별도 검토가 필요하거나 미확인이라면 체크하지 마세요. 구체적인 민감정보를 적지 않습니다.</p><label for="assessment-basis">최소 검토 근거 참조</label><textarea id="assessment-basis" name="basis" maxlength="500" th:text="${assessmentForm.basis}" required></textarea><label for="assessment-reason">등록 사유</label><input id="assessment-reason" name="reason" maxlength="500" th:value="${assessmentForm.reason}" required><button>적용 검토 버전 저장</button></form></section></main></body></html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="htmx-config" content='{"historyCacheSize":0,"allowEval":false,"includeIndicatorStyles":false}'>
    <title>로그인 · tna</title>
    <link rel="stylesheet" th:href="@{/app.css}">
    <script th:src="@{/vendor/htmx.min.js}" defer></script>
</head>
<body hx-history="false">
<main class="login-shell">
    <section class="panel" aria-labelledby="login-title">
        <p class="eyebrow">tna · 로컬 개발 환경</p>
        <h1 id="login-title">로그인</h1>
        <p>소속 회사 코드와 계정으로 로그인해 주세요.</p>
        <p th:if="${param.error}" class="notice error" role="alert">로그인 정보를 확인해 주세요.</p>
        <p th:if="${param.logout}" class="notice" role="status">로그아웃했습니다.</p>
        <form th:action="@{/login}" method="post">
            <label for="companyCode">회사 코드</label>
            <input id="companyCode" name="companyCode" type="text" autocomplete="organization"
                   maxlength="80" required>
            <label for="email">이메일</label>
            <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="current-password"
                   minlength="12" maxlength="256" required aria-describedby="password-help">
            <p id="password-help" class="hint">공백을 포함한 12~128자의 비밀번호를 사용합니다.</p>
            <button type="submit">로그인</button>
        </form>
        <p class="hint">현재는 개발 기반 확인 단계입니다. 초대·비밀번호 재설정은 후속 구현입니다.</p>
    </section>
</main>
</body>
</html>

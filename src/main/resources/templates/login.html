<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="htmx-config" content='{"historyCacheSize":0,"allowEval":false,"includeIndicatorStyles":false}'>
    <title>로그인 · WorkLog</title>
    <link rel="stylesheet" th:href="@{/app.css}">
    <script th:src="@{/vendor/htmx.min.js}" defer></script>
</head>
<body hx-history="false">
<main class="login-shell">
    <section class="panel" aria-labelledby="login-title">
        <p class="eyebrow">WorkLog · 로컬 개발 환경</p>
        <h1 id="login-title">로그인</h1>
        <p th:text="${localDemo ? '아이디와 비밀번호로 로그인해 주세요.' : '소속 회사 코드와 계정으로 로그인해 주세요.'}">소속 회사 코드와 계정으로 로그인해 주세요.</p>
        <p th:if="${param.error}" class="notice error" role="alert">로그인 정보를 확인해 주세요.</p>
        <p th:if="${param.logout}" class="notice" role="status">로그아웃했습니다.</p>
        <p th:if="${!localDemo and param.invited != null}" class="notice" role="status">초대를 수락했습니다. 회사 코드와 이메일로 로그인해 주세요.</p>
        <p th:if="${param.reset != null}" class="notice" role="status">비밀번호를 재설정했습니다. 새 비밀번호로 로그인해 주세요.</p>
        <form th:action="@{/login}" method="post">
            <th:block th:unless="${localDemo}">
                <label for="companyCode">회사 코드</label>
                <input id="companyCode" name="companyCode" type="text" autocomplete="organization"
                       maxlength="80" required>
            </th:block>
            <label for="email" th:text="${localDemo ? '아이디' : '이메일'}">이메일</label>
            <input id="email" name="email" type="email" th:type="${localDemo ? 'text' : 'email'}"
                   autocomplete="username" maxlength="254" required>
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="current-password"
                   minlength="12" th:minlength="${localDemo ? 5 : 12}" maxlength="256" required aria-describedby="password-help">
            <p id="password-help" class="hint" th:text="${localDemo ? '로컬 데모 계정은 admin / admin입니다.' : '공백을 포함한 12~128자의 비밀번호를 사용합니다.'}">공백을 포함한 12~128자의 비밀번호를 사용합니다.</p>
            <button type="submit">로그인</button>
        </form>
        <p th:unless="${localDemo}"><a th:href="@{/password-reset}">비밀번호 재설정</a></p>
        <p th:unless="${localDemo}" class="hint">초대 수락 후 로그인할 수 있습니다. 개발 단계는 로컬 모의 전달만 사용합니다.</p>
    </section>
</main>
</body>
</html>

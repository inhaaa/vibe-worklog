spring:
  application:
    name: vibe-attendance
  datasource:
    url: ${TNA_JDBC_URL}
    username: tna_app
    password: ${TNA_APP_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false
  thymeleaf:
    cache: true
tna:
  operator:
    enabled: ${TNA_OPERATOR_ENABLED:false}
    url: ${TNA_JDBC_URL}
    password: ${TNA_OPERATOR_DB_PASSWORD:}
  auth:
    url: ${TNA_JDBC_URL}
    username: tna_auth
    password: ${TNA_AUTH_DB_PASSWORD}
server:
  address: 127.0.0.1
  port: 18080
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

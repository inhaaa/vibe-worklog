# Use after compose.yaml and compose.operator.yaml for local customer activation.
name: vibe-attendance-opening

services:
  db:
    image: vibe-attendance-opening-postgres:18.6-security
    ports: !override
      - "127.0.0.1:15434:5432"

  app:
    environment:
      SPRING_PROFILES_ACTIVE: local
      TNA_MAIL_MODE: smtp
      TNA_MAIL_FROM: worklog@example.test
      TNA_MAIL_PUBLIC_ORIGIN: http://127.0.0.1:18082
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      SPRING_APPLICATION_JSON: >-
        {"spring.mail.properties[mail.smtp.starttls.enable]":false,
         "spring.mail.properties[mail.smtp.starttls.required]":false}
    ports: !override
      - "127.0.0.1:18082:18080"
    depends_on:
      mailpit:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:18025:8025"
